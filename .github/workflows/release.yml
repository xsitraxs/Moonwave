# Builds the installers for Windows, macOS and Linux and attaches them, with the auto-updater's metadata
# (latest.yml / latest-mac.yml / latest-linux.yml) and a single combined SHA256SUMS.txt, to the GitHub Release for the
# pushed tag.
#
# To make a release, on your machine:
#   1. bump "version" in package.json (the updater and the files are built from it)
#   2. commit, push to main, wait for the CI workflow to go green
#   3. git tag vX.Y.Z && git push origin vX.Y.Z     (or: gh release create vX.Y.Z --generate-notes)
# This workflow builds the three platforms in read-only jobs first, then merges their artifacts in one gated `release`
# job that writes SHA256SUMS.txt across all three OSes, attests every file's provenance, and uploads to the release.
# It never runs on pull requests and never creates a tag by itself.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

# Nothing here may write anything unless the step needs it: the token is read-only for the whole workflow (including
# the three platform build jobs), and only the final `release` job widens it to attach and attest what was built.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  ONNXRUNTIME_NODE_INSTALL: skip
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  build:
    name: Build · ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-15
            name: macos
          - os: ubuntu-24.04
            name: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24
          cache: npm

      # the tag must be the version in package.json (modulo a missing patch: v2.4 means 2.4.0)
      - name: The tag matches the package version
        shell: bash
        run: |
          node -e 'const v=require("./package.json").version;const t=process.env.GITHUB_REF_NAME.replace(/^v/,"");const n=(s)=>s.split(".").concat(["0","0","0"]).slice(0,3).join(".");if(n(t)!==n(v)){console.error("tag "+t+" != package.json version "+v+" — refusing to build");process.exit(1)}console.log("tag matches package.json:",v)'

      # a transient registry/GitHub blip must not kill the job silently — the tail of the log is attached as a
      # scrubbed annotation (readable via the check-runs API); the install is retried once first
      # cache the Electron dist and the electron-builder tool archives (NSIS, AppImage tools, …) between runs —
      # GitHub's release downloads throttle/504 under simultaneous CI load (linux won the race once and passed; every
      # other job hit 504). Both caches are content-addressed and checksum-verified by electron-builder itself.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: builder-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        shell: bash
        run: |
          set +e
          ( npm ci --ignore-scripts || npm ci --ignore-scripts ) 2>&1 | tee npmci.log
          ec=$?
          set -eo pipefail
          if [ "$ec" -ne 0 ]; then
            tail -c 2500 npmci.log \
              | sed -E -e 's#(//)[^/@" '"'"']+:[^/@" '"'"']+@#\1***:***@#g' -e 's/[[:cntrl:]]/ /g' \
              | base64 | tr -d '\n' > tail.b64
            echo "::error title=release-npm-ci-tail-b64::$(cat tail.b64)"
            exit "$ec"
          fi

      # optional: the built-in proxy and the server address are not in git (see server/README.md)
      # the asset CDN behind github.com's release downloads returns 504s today — pre-fetch the big immutable files
      # with curl (resume + checksums) so the packaging step finds them already cached, then serve them on loopback
      - name: Pre-fetch the build tools
        shell: bash
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/prefetch-tools.sh

      # If the pre-fetch verified every dist file for this platform, serve them on loopback and point electron-builder at the
      # mirror via ELECTRON_MIRROR. @electron/get always re-fetches SHASUMS256.txt — even on a full cache hit — so merely
      # populating its cache cannot survive a CDN outage; loopback can. Official files, verified against the official
      # SHASUMS256.txt by the pre-fetch and re-validated by sumchecker on every download; 127.0.0.1 only, no TLS involved.
      - name: Serve the verified Electron dist on loopback (if ready)
        shell: bash
        run: |
          M_ROOT="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/ci-electron-mirror"
          if [ -f "$M_ROOT/READY" ]; then
            ELECTRON_VERSION="$(node -p "require('./node_modules/electron/package.json').version")"
            nohup node scripts/serve-static.mjs --root "$M_ROOT" --port 8137 > "$M_ROOT/server.log" 2>&1 &
            echo $! > "$M_ROOT/server.pid"
            ok=0
            i=0
            while [ "$i" -lt 50 ]; do
              if curl -fsS -o /dev/null "http://127.0.0.1:8137/v${ELECTRON_VERSION}/SHASUMS256.txt"; then ok=1; break; fi
              sleep 0.2
              i=$((i+1))
            done
            if [ "$ok" = 1 ]; then
              echo "ELECTRON_MIRROR=http://127.0.0.1:8137/" >> "$GITHUB_ENV"
              echo "loopback mirror is up — electron-builder will not touch the release CDN"
            else
              echo "loopback mirror did not come up — leaving ELECTRON_MIRROR unset; electron-builder uses the network"
              kill "$(cat "$M_ROOT/server.pid")" 2>/dev/null || true
            fi
          else
            echo "no complete mirror — electron-builder will use its seeded cache or the network"
          fi

      - name: The built-in proxy and the server address
        shell: bash
        env:
          PROXY_JSON: ${{ secrets.SC_PROXY_JSON }}
          SERVER_JSON: ${{ secrets.SC_SERVER_JSON }}
        run: |
          if [ -n "$PROXY_JSON" ]; then printf '%s' "$PROXY_JSON" > proxy.local.json; echo "proxy: yes"; else echo "proxy: none"; fi
          if [ -n "$SERVER_JSON" ]; then printf '%s' "$SERVER_JSON" > server.local.json; echo "server: yes"; else echo "server: none"; fi

      # lint + typecheck + electron-vite build + electron-builder + verify-dist (fails if the update metadata is missing).
      - name: Package and verify the update metadata
        shell: bash
        timeout-minutes: 25
        run: |
          set -eo pipefail
          ec=0
          for attempt in 1 2 3; do
            set +e
            node scripts/dist.mjs 2>&1 | tee dist.log
            ec=$?
            set -e
            if [ "$ec" -eq 0 ]; then break; fi
            echo "packaging attempt $attempt failed (exit $ec) — retrying in 25 s"
            sleep 25
          done
          if [ "$ec" -ne 0 ]; then
            grep -vE '^\s+at ' dist.log | tail -c 2500 \
              | sed -E -e 's#(//)[^/@" '"'"']+:[^/@" '"'"']+@#\1***:***@#g' -e 's/[[:cntrl:]]/ /g' \
              | base64 | tr -d '\n' > tail.b64
            echo "::error title=package-log-tail-b64::$(cat tail.b64)"
            exit "$ec"
          fi

      - name: No secrets in the built files
        run: node scripts/scan-dist.mjs dist

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error
          retention-days: 30

      - name: Stop the loopback mirror
        if: always()
        shell: bash
        run: |
          M_ROOT="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/ci-electron-mirror"
          if [ -f "$M_ROOT/server.pid" ]; then kill "$(cat "$M_ROOT/server.pid")" 2>/dev/null || true; echo "mirror stopped"; else echo "no mirror to stop"; fi

  release:
    name: Publish & attest release
    needs: build
    # the tag push is the only way in, and the environment is where the owner adds required reviewers or a deployment
    # branch rule in the repository settings — this file can only name it, not configure it
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 24

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      # all three platforms' update manifests must be present before writing one combined SHA256SUMS.txt
      - name: Checksums (all three platforms combined)
        shell: bash
        run: |
          set -euo pipefail
          for yml in dist/latest.yml dist/latest-mac.yml dist/latest-linux.yml; do
            if [ ! -f "$yml" ]; then echo "missing $yml in merged release artifacts"; exit 1; fi
          done
          node scripts/checksums.mjs dist

      - name: Attest the provenance of every published file
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/SHA256SUMS.txt

      - name: Attach the installers and the update metadata to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          shopt -s nullglob
          files=(dist/*.exe dist/*.dmg dist/*.zip dist/*.AppImage dist/*.deb dist/latest*.yml dist/*.blockmap dist/SHA256SUMS.txt)
          if [ ${#files[@]} -eq 0 ]; then echo "nothing to attach — verify-dist should have failed first"; exit 1; fi
          printf 'attaching:\n%s\n' "${files[@]}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Moonwave $TAG" --generate-notes
          gh release upload "$TAG" "${files[@]}" --clobber
