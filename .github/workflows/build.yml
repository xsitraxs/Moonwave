# sc player for macOS (Apple Silicon + Intel: .dmg, .zip) and Linux (x64: .AppImage, .deb), built on GitHub's
# machines — nobody here has a Mac. Windows is built the same way. This workflow is for test builds: the files come
# out as the run's artifacts. Official releases (installers + update metadata attached to a GitHub Release) are made
# by pushing a vX.Y.Z tag — see .github/workflows/release.yml; pull requests run .github/workflows/ci.yml.
#
# The built-in proxy and the server address are not in git: the repository secrets SC_PROXY_JSON and SC_SERVER_JSON
# hold proxy.local.json and server.local.json (a build without them simply has neither).
name: Build macOS and Linux

on:
  push:
    branches: [v2, platforms]
  workflow_dispatch:

permissions:
  contents: read

env:
  ONNXRUNTIME_NODE_INSTALL: skip
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"


concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            name: macos
          - os: ubuntu-24.04
            name: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # cache the Electron dist and the electron-builder tool archives between runs (GitHub's release downloads
      # throttle and 504 under simultaneous CI load)
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: builder-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci --ignore-scripts

      # the asset CDN behind github.com's release downloads returns 504s today — pre-fetch the big immutable files
      # with curl (resume + checksums) so the packaging step finds them already cached, then serve them on loopback
      - name: Pre-fetch the build tools
        shell: bash
        run: bash scripts/prefetch-tools.sh

      # If the pre-fetch verified every dist file for this platform, serve them on loopback and point electron-builder at the
      # mirror via ELECTRON_MIRROR. @electron/get always re-fetches SHASUMS256.txt — even on a full cache hit — so merely
      # populating its cache cannot survive a CDN outage; loopback can. Official files, verified against the official
      # SHASUMS256.txt by the pre-fetch and re-validated by sumchecker on every download; 127.0.0.1 only, no TLS involved.
      - name: Serve the verified Electron dist on loopback (if ready)
        shell: bash
        run: |
          M_ROOT="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/ci-electron-mirror"
          if [ -f "$M_ROOT/READY" ]; then
            ELECTRON_VERSION="$(node -p "require('./node_modules/electron/package.json').version")"
            nohup node scripts/serve-static.mjs --root "$M_ROOT" --port 8137 > "$M_ROOT/server.log" 2>&1 &
            echo $! > "$M_ROOT/server.pid"
            ok=0
            i=0
            while [ "$i" -lt 50 ]; do
              if curl -fsS -o /dev/null "http://127.0.0.1:8137/v${ELECTRON_VERSION}/SHASUMS256.txt"; then ok=1; break; fi
              sleep 0.2
              i=$((i+1))
            done
            if [ "$ok" = 1 ]; then
              echo "ELECTRON_MIRROR=http://127.0.0.1:8137/" >> "$GITHUB_ENV"
              echo "loopback mirror is up — electron-builder will not touch the release CDN"
            else
              echo "loopback mirror did not come up — leaving ELECTRON_MIRROR unset; electron-builder uses the network"
              kill "$(cat "$M_ROOT/server.pid")" 2>/dev/null || true
            fi
          else
            echo "no complete mirror — electron-builder will use its seeded cache or the network"
          fi

      - name: The built-in proxy and the server address
        shell: bash
        env:
          PROXY_JSON: ${{ secrets.SC_PROXY_JSON }}
          SERVER_JSON: ${{ secrets.SC_SERVER_JSON }}
        run: |
          if [ -n "$PROXY_JSON" ]; then printf '%s' "$PROXY_JSON" > proxy.local.json; echo "proxy: yes"; else echo "proxy: none"; fi
          if [ -n "$SERVER_JSON" ]; then printf '%s' "$SERVER_JSON" > server.local.json; echo "server: yes"; else echo "server: none"; fi

      - run: npm test

      - run: node scripts/dist.mjs

      # the built app starts and is still running 25 s later (a crash on start fails the run)
      - name: The app starts (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          SC_NO_COUNT=1 "dist/mac-arm64/sc player.app/Contents/MacOS/sc player" > start.log 2>&1 &
          pid=$!
          sleep 25
          if kill -0 "$pid" 2>/dev/null; then kill "$pid"; ok=1; echo "running after 25 s"; else ok=0; echo "exited on start"; fi
          echo "--- what it printed (last 80 lines; addresses and logins masked) ---"
          tail -n 80 start.log | sed -E 's#://[^/@ ]+@#://***@#g; s#[0-9]{1,3}(\.[0-9]{1,3}){3}#x.x.x.x#g'
          echo "--- how long the start took (the app's own log) ---"
          grep "start:" "$HOME/Library/Application Support/sc player/logs/main.log" || echo "(no start line)"
          [ "$ok" = 1 ]

      # run as users run it: the AppImage mounted through FUSE, not unpacked (an xz-packed image took 40 s to start)
      - name: The app starts (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get install -y -qq fuse3 > /dev/null
          chmod +x dist/*.AppImage
          SC_NO_COUNT=1 xvfb-run -a dist/*.AppImage --no-sandbox > start.log 2>&1 &
          pid=$!
          sleep 25
          if kill -0 "$pid" 2>/dev/null; then kill "$pid"; ok=1; echo "running after 25 s"; else ok=0; echo "exited on start"; fi
          echo "--- what it printed (last 80 lines; addresses and logins masked) ---"
          tail -n 80 start.log | sed -E 's#://[^/@ ]+@#://***@#g; s#[0-9]{1,3}(\.[0-9]{1,3}){3}#x.x.x.x#g'
          echo "--- how long the start took (the app's own log) ---"
          grep "start:" "$HOME/.config/sc player/logs/main.log" || echo "(no start line)"
          [ "$ok" = 1 ]

      - uses: actions/upload-artifact@v4
        with:
          name: sc-player-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest-*.yml
          if-no-files-found: error
          retention-days: 14

      - name: Stop the loopback mirror
        if: always()
        shell: bash
        run: |
          M_ROOT="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/ci-electron-mirror"
          if [ -f "$M_ROOT/server.pid" ]; then kill "$(cat "$M_ROOT/server.pid")" 2>/dev/null || true; echo "mirror stopped"; else echo "no mirror to stop"; fi
