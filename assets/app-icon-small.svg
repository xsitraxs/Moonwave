<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
<!-- Moonwave at small sizes (title bar, the VK import bar): the icon (assets/app-icon.png) redrawn in flat shapes — a
     pale moon over a midnight-to-teal sky with the sea rising in its lower part — so it stays crisp at 16–24 px -->
<defs>
<linearGradient id="mw-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1240"/><stop offset="1" stop-color="#0a4c57"/></linearGradient>
<clipPath id="mw-moon"><circle cx="50" cy="46" r="34"/></clipPath>
</defs>
<rect width="100" height="100" rx="22.5" fill="url(#mw-sky)"/>
<circle cx="50" cy="46" r="34" fill="#f4e7c9"/>
<g clip-path="url(#mw-moon)">
<path d="M0 60 C 18 52 32 64 50 58 S 78 46 100 54 V100 H0 Z" fill="#1d8e9b"/>
<path d="M0 69 C 20 61 36 72 56 66 S 84 58 100 63 V100 H0 Z" fill="#46cbc3"/>
<path d="M0 77 C 22 70 40 80 60 75 S 86 70 100 73 V100 H0 Z" fill="#14728a"/>
</g>
</svg>
