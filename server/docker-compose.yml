services:
  caddy:
    build: ./caddy
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    cap_drop:
      - ALL
    # bind privileged ports 80/443 inside the container as the unprivileged caddy user
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /run
      - /var/run
      - /tmp
    mem_limit: 256m
    pids_limit: 50
    depends_on:
      - api

  api:
    build: ./api
    restart: unless-stopped
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      # Caddy is the only way in (`expose: 8080` is internal to the Compose network) and Caddy's reverse_proxy
      # overwrites untrusted X-Forwarded-For with the real client IP. Keep TRUST_PROXY="1" here: without it, the API
      # would key rate limits on Caddy's container IP and collapse every user into one shared bucket.
      TRUST_PROXY: "1"
    volumes:
      - api-data:/data
    # reachable only through Caddy
    expose:
      - "8080"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /run
      - /var/run
      - /tmp
    mem_limit: 512m
    pids_limit: 100

volumes:
  caddy-data:
  caddy-config:
  api-data:
