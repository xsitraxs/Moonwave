services:
  caddy:
    build: ./caddy
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

  api:
    build: ./api
    restart: unless-stopped
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      # Caddy is the only way in (the api's port is not published) and it sets X-Forwarded-For; the API trusts it
      # here and nowhere else, since otherwise a client could choose its own rate-limit bucket
      TRUST_PROXY: "1"
    volumes:
      - api-data:/data
    # reachable only through Caddy
    expose:
      - "8080"

volumes:
  caddy-data:
  caddy-config:
  api-data:
